# AutoCash on Cloud Run (asia-south1). Set secrets in Secret Manager and grant
# the Cloud Run service account access; never put secret values in this file.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/autocash:$SHORT_SHA', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/$PROJECT_ID/autocash:$SHORT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - autocash
      - --image=gcr.io/$PROJECT_ID/autocash:$SHORT_SHA
      - --region=asia-south1
      - --platform=managed
      - --no-allow-unauthenticated
      - --set-env-vars=AUTOCASH_DATA_DIR=/app/data
      - --set-secrets=AUTOCASH_BOOTSTRAP_KEY=autocash-bootstrap:latest,GEMINI_API_KEY=autocash-gemini:latest
images: ['gcr.io/$PROJECT_ID/autocash:$SHORT_SHA']
